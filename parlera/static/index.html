<!doctype html>
<html lang="en" data-lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Parlera</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icon-1024.png">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="brand"><img class="brand-logo" src="/static/favicon.svg" alt="" width="32" height="32">Parlera</div>
      <div class="lang-switch" id="lang-switch"></div>
      <nav class="nav" id="nav"></nav>
      <div id="sidebar-actions"></div>
      <div class="sidebar-foot" id="status"></div>
    </aside>
    <main id="main"></main>
  </div>
  <div id="toasts"></div>
  <div id="modal-root"></div>
  <script>
    // If the app fails to start (e.g. a script couldn't load), show why instead of a blank page.
    (function () {
      var errors = [];
      window.addEventListener('error', function (e) {
        errors.push((e.message || (e.target && e.target.src ? 'Could not load ' + e.target.src : 'Script error')));
      }, true);
      window.addEventListener('unhandledrejection', function (e) { errors.push(String(e.reason && e.reason.message || e.reason)); });
      setTimeout(function () {
        if (window.__parleraBooted) return;
        var box = document.createElement('div');
        box.style.cssText = 'position:fixed;inset:0;display:grid;place-items:center;background:#f6f4ef;font:15px -apple-system,sans-serif;color:#1f1d1a;z-index:999;padding:20px';
        box.innerHTML = '<div style="max-width:560px"><h2>Parlera didn\'t start properly</h2>' +
          '<p>Try a hard reload: <b>⌥⌘R</b> in Safari (or <b>⇧⌘R</b> in Chrome). If that doesn\'t help, check the Terminal window for errors.</p>' +
          '<pre style="white-space:pre-wrap;background:#fff;border:1px solid #ddd;border-radius:8px;padding:10px;font-size:12px">' +
          (errors.length ? errors.join('\n').replace(/</g, '&lt;') : 'No error message — the server may be busy or stopped.') +
          '\nBuild: __BUILD__</pre><button onclick="location.reload()" style="padding:8px 14px;border-radius:8px;border:1px solid #ccc;background:#fff">Reload</button></div>';
        document.body.appendChild(box);
      }, 12000);
    })();
  </script>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
