<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f5bd3"/>
      <stop offset="0.55" stop-color="#1f3f9e"/>
      <stop offset="1" stop-color="#152a6b"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8eefc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0b1640" flood-opacity="0.28"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0b1640" flood-opacity="0.30"/>
    </filter>
  </defs>
  <!-- macOS-style squircle tile (Big Sur grid: 824 px tile on a 1024 canvas) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#shine)"/>
  <!-- speech bubble -->
  <path d="M300 300 h424 a96 96 0 0 1 96 96 v200 a96 96 0 0 1 -96 96 h-250 l-118 96 a14 14 0 0 1 -23 -11 v-85 h-33 a96 96 0 0 1 -96 -96 v-200 a96 96 0 0 1 96 -96 z"
        fill="url(#bubble)" filter="url(#soft)"/>
  <!-- voice waveform: one colour per language (Swedish yellow, French red, English blue) -->
  <g stroke-linecap="round" stroke-width="44">
    <line x1="372" y1="456" x2="372" y2="536" stroke="#f5c400"/>
    <line x1="442" y1="406" x2="442" y2="586" stroke="#f5c400"/>
    <line x1="512" y1="370" x2="512" y2="622" stroke="#e2453c"/>
    <line x1="582" y1="420" x2="582" y2="572" stroke="#2b4fbf"/>
    <line x1="652" y1="466" x2="652" y2="526" stroke="#2b4fbf"/>
  </g>
</svg>
