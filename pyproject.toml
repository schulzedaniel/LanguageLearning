[project]
name = "parlera"
version = "0.1.0"
description = "Local, private language tutor: voice conversations with a local LLM, a CEFR curriculum, and Anki flashcards."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
  "wordfreq>=3.0",
  "lingua-language-detector>=2.0",
  "genanki>=0.13",
]

[project.optional-dependencies]
# Fast Whisper on Apple Silicon (recommended on Mac)
mac = ["mlx-whisper>=0.4"]
# Cross-platform Whisper (CPU/CUDA); also lets you use CTranslate2 models such as KB-Whisper
faster = ["faster-whisper>=1.0"]
# Neural offline TTS voices (French, Swedish, English, ...)
piper = ["piper-tts>=1.2"]
dev = ["pytest>=8"]

[project.scripts]
parlera = "parlera.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["parlera*"]

[tool.setuptools.package-data]
parlera = ["defaults/**/*", "static/**/*"]
